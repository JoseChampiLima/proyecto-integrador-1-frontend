<div class="form-page">
  <div class="mantenimiento-header">
    <h2 class="mantenimiento-title">{{ modoEdicion() ? 'Editar Estado de Reserva' : 'Nuevo Estado de Reserva' }}</h2>
  </div>

  @if (errorMessage()) {
    <div class="alert-error">{{ errorMessage() }}</div>
  }

  @if (isLoading()) {
    <p class="estado-carga">Cargando estado de reserva...</p>
  } @else {
    <form [formGroup]="estadosReservaForm" (ngSubmit)="onSubmit()" class="form-card">

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre</label>
          <input id="nombre" type="text" formControlName="nombre" class="form-input"
            [class.is-invalid]="estadosReservaForm.get('nombre')?.touched && estadosReservaForm.get('nombre')?.invalid" />
        </div>

        <div class="form-group">
          <label class="form-label" for="descripcion">Descripción</label>
          <input id="descripcion" type="text" formControlName="descripcion" class="form-input"
            [class.is-invalid]="estadosReservaForm.get('descripcion')?.touched && estadosReservaForm.get('descripcion')?.invalid" />
        </div>

        <div class="form-group form-group-checkbox">
          <label class="form-label" for="estado">Estado</label>
          <label class="switch-wrapper">
            <input id="estado" type="checkbox" formControlName="estado" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-text">{{ estadosReservaForm.get('estado')?.value ? 'Activo' : 'Inactivo' }}</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secundario" (click)="cancelar()" [disabled]="isSaving()">
          Cancelar
        </button>
        <button type="submit" class="btn-primary-custom" [disabled]="estadosReservaForm.invalid || isSaving()">
          {{ isSaving() ? 'Guardando...' : (modoEdicion() ? 'Guardar Cambios' : 'Crear Estado de Reserva') }}
        </button>
      </div>
    </form>
  }
</div>
