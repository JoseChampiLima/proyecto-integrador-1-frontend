<div class="form-page">
  <div class="mantenimiento-header">
    <h2 class="mantenimiento-title">{{ modoEdicion() ? 'Editar Sede' : 'Nueva Sede' }}</h2>
  </div>

  @if (errorMessage()) {
    <div class="alert-error">{{ errorMessage() }}</div>
  }

  @if (isLoading()) {
    <p class="estado-carga">Cargando sede...</p>
  } @else {
    <form [formGroup]="sedeForm" (ngSubmit)="onSubmit()" class="form-card">

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="nombre">Nombre</label>
          <input id="nombre" type="text" formControlName="nombre" class="form-input"
            [class.is-invalid]="sedeForm.get('nombre')?.touched && sedeForm.get('nombre')?.invalid" />
        </div>

        <div class="form-group">
          <label class="form-label" for="descripcion">Descripción</label>
          <input id="descripcion" type="text" formControlName="descripcion" class="form-input"
            [class.is-invalid]="sedeForm.get('descripcion')?.touched && sedeForm.get('descripcion')?.invalid" />
        </div>

        <div class="form-group">
          <label class="form-label" for="direccion">Dirección</label>
          <input id="direccion" type="text" formControlName="direccion" class="form-input"
            [class.is-invalid]="sedeForm.get('direccion')?.touched && sedeForm.get('direccion')?.invalid" />
        </div>

        <div class="form-group">
          <label class="form-label" for="distrito">Distrito</label>
          <input id="distrito" type="text" formControlName="distrito" class="form-input"
            [class.is-invalid]="sedeForm.get('distrito')?.touched && sedeForm.get('distrito')?.invalid" />
        </div>

        <div class="form-group">
          <label class="form-label" for="telefono">Teléfono</label>
          <input id="telefono" type="text" formControlName="telefono" maxlength="9" class="form-input"
            [class.is-invalid]="sedeForm.get('telefono')?.touched && sedeForm.get('telefono')?.invalid" />
        </div>

        <div class="form-group form-group-checkbox">
          <label class="form-label" for="estado">Estado</label>
          <label class="switch-wrapper">
            <input id="estado" type="checkbox" formControlName="estado" />
            <span class="switch-track"><span class="switch-thumb"></span></span>
            <span class="switch-text">{{ sedeForm.get('estado')?.value ? 'Activo' : 'Inactivo' }}</span>
          </label>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secundario" (click)="cancelar()" [disabled]="isSaving()">
          Cancelar
        </button>
        <button type="submit" class="btn-primary-custom" [disabled]="sedeForm.invalid || isSaving()">
          {{ isSaving() ? 'Guardando...' : (modoEdicion() ? 'Guardar Cambios' : 'Crear Sede') }}
        </button>
      </div>
    </form>
  }
</div>
