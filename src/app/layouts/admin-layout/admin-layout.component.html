<button type="button" class="sidebar-toggle-mobile d-lg-none" (click)="toggleSidebar()">
  ☰ Menú de gestión
</button>

<div class="admin-shell">
  <aside class="admin-sidebar" [class.sidebar-open]="sidebarOpen()">
    <nav class="admin-nav">
      <ng-container *ngFor="let item of menuItems; let i = index">

        <!-- Enlace simple -->
        <a *ngIf="!item.children; else submenuBlock"
           [routerLink]="item.routerLink"
           [routerLinkActiveOptions]="{exact: item.exact ?? false}"
           routerLinkActive="active-item"
           class="admin-nav-link">
          <span class="nav-icon">{{ item.icon }}</span> {{ item.label }}
        </a>

        <!-- Menú desplegable -->
        <ng-template #submenuBlock>
          <div class="admin-nav-group">
            <button type="button"
                    class="admin-nav-link admin-nav-toggle"
                    (click)="toggleMenu(i)"
                    [class.active-parent]="item.isOpen">
              <span class="nav-icon">{{ item.icon }}</span> {{ item.label }}
              <span class="toggle-icon" [class.rotated]="item.isOpen">▼</span>
            </button>

            <div class="admin-submenu" [class.submenu-open]="item.isOpen">
              <a *ngFor="let child of item.children"
                 [routerLink]="child.routerLink"
                 routerLinkActive="active-item"
                 class="admin-nav-link admin-submenu-link">
                {{ child.label }}
              </a>
            </div>
          </div>
        </ng-template>

      </ng-container>
    </nav>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
